<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresca - Fresh Fruit Cups & Shakes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating Fruit Doodles -->
    <div class="fruit-doodles">
        <div class="doodle strawberry" style="top: 10%; left: 5%;"></div>
        <div class="doodle mango" style="top: 20%; right: 8%;"></div>
        <div class="doodle kiwi" style="bottom: 20%; left: 10%;"></div>
        <div class="doodle cherry" style="top: 40%; right: 5%;"></div>
        <div class="doodle grape" style="bottom: 10%; right: 15%;"></div>
        <div class="doodle orange" style="top: 60%; left: 3%;"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <img src="logo.png" alt="Fresca" class="logo" id="mainLogo">
                <div class="logo-glow"></div>
            </div>
            <h1 class="brand-title">FRESCA</h1>
            <p class="tagline">Flavorful Freshness in Every Bite</p>
        </header>

        <!-- Menu Section -->
        <main class="menu-section" id="menuSection">
            <h2 class="section-title">OUR MENU</h2>
            <div class="products-grid">
                <!-- Fruit Cup Card -->
                <div class="product-card" data-product="fruitcup">
                    <div class="card-image-wrapper">
                        <div class="cup-illustration">
                            <div class="cup">
                                <div class="fruit fruit1"></div>
                                <div class="fruit fruit2"></div>
                                <div class="fruit fruit3"></div>
                                <div class="fruit fruit4"></div>
                            </div>
                        </div>
                    </div>
                    <h3 class="product-name">Fruit Cup</h3>
                    <div class="size-selector">
                        <label class="size-option">
                            <input type="radio" name="fruit-size" value="small" checked>
                            <span>Small</span>
                            <span class="size-price">₨150</span>
                        </label>
                        <label class="size-option">
                            <input type="radio" name="fruit-size" value="regular">
                            <span>Regular</span>
                            <span class="size-price">₨190</span>
                        </label>
                    </div>
                    <p class="product-price">Starting from <span>₨150</span></p>
                    <button class="book-btn" onclick="openBooking('fruitcup')">
                        <span>BOOK NOW</span>
                        <span class="btn-icon">→</span>
                    </button>
                </div>

                <!-- Strawberry Shake Card -->
                <div class="product-card" data-product="shake">
                    <div class="card-image-wrapper">
                        <div class="shake-illustration">
                            <div class="straw"></div>
                            <div class="shake">
                                <div class="shake-content"></div>
                            </div>
                        </div>
                    </div>
                    <h3 class="product-name">Strawberry Shake</h3>
                    <p class="product-price">₨220</p>
                    <button class="book-btn" onclick="openBooking('shake')">
                        <span>BOOK NOW</span>
                        <span class="btn-icon">→</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div class="booking-modal" id="bookingModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeBooking()">✕</button>
            
            <div class="booking-header">
                <h2 id="bookingTitle">Customize Your Order</h2>
            </div>

            <div class="booking-body">
                <!-- Product Display -->
                <div class="booking-product-display">
                    <div id="productDisplay" class="product-display-item"></div>
                    <div class="quantity-control">
                        <button class="qty-btn minus" onclick="decreaseQty()">−</button>
                        <input type="number" id="quantity" value="1" min="1" readonly>
                        <button class="qty-btn plus" onclick="increaseQty()">+</button>
                    </div>
                    <p class="qty-display">Quantity: <span id="qtyDisplay">1</span></p>
                </div>

                <!-- Toppings Section -->
                <div class="toppings-section">
                    <h3 class="section-label">ADD TOPPINGS & EXTRAS</h3>
                    <div class="toppings-grid">
                        <label class="topping-option">
                            <input type="checkbox" value="strawberry-syrup" onchange="updateToppings()">
                            <div class="topping-icon">🍓</div>
                            <span>Strawberry Syrup</span>
                            <span class="topping-price">+₨10</span>
                        </label>
                        <label class="topping-option">
                            <input type="checkbox" value="chocolate-syrup" onchange="updateToppings()">
                            <div class="topping-icon">🍫</div>
                            <span>Chocolate Syrup</span>
                            <span class="topping-price">+₨10</span>
                        </label>
                        <label class="topping-option">
                            <input type="checkbox" value="custard" onchange="updateToppings()">
                            <div class="topping-icon">🍮</div>
                            <span>Custard</span>
                            <span class="topping-price">+₨10</span>
                        </label>
                        <label class="topping-option">
                            <input type="checkbox" value="condensed-milk" onchange="updateToppings()">
                            <div class="topping-icon">🥛</div>
                            <span>Condensed Milk</span>
                            <span class="topping-price">+₨10</span>
                        </label>
                    </div>
                </div>

                <!-- Price Summary -->
                <div class="price-summary">
                    <div class="price-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">₨150</span>
                    </div>
                    <div class="price-row">
                        <span>Toppings:</span>
                        <span id="toppingTotal">₨0</span>
                    </div>
                    <div class="price-row total">
                        <span>Total:</span>
                        <span id="totalPrice">₨150</span>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="booking-footer">
                <button class="btn-secondary" onclick="closeBooking()">Cancel</button>
                <button class="btn-primary" onclick="proceedToDetails()">Continue to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Customer Details Modal -->
    <div class="details-modal" id="detailsModal">
        <div class="modal-content details-content">
            <button class="close-btn" onclick="closeDetails()">✕</button>
            
            <div class="booking-header">
                <h2>Delivery Details</h2>
                <p class="step-indicator">Step 1 of 2</p>
            </div>

            <div class="form-container">
                <div class="form-group">
                    <label for="customerName">Your Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="customerName" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="customerPhone">Phone Number</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="customerPhone" placeholder="03XX-XXXXXXX" required>
                    </div>
                </div>

                <div class="order-summary-box">
                    <h4>Order Summary</h4>
                    <div id="orderSummaryDetails"></div>
                    <div class="summary-total">
                        Total: <span id="summaryTotal">₨150</span>
                    </div>
                </div>
            </div>

            <div class="booking-footer">
                <button class="btn-secondary" onclick="backToBooking()">Back</button>
                <button class="btn-primary" onclick="confirmAndRedirect()">
                    <span>Confirm Order</span>
                    <span class="btn-icon">→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
